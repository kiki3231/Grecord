mybatis-plus:
  typeAliasesPackage: com.ma.**.entity
  mapperLocations: classpath*:mapper/**/*Mapper.xml

spring:
  main:
    allow-bean-definition-overriding: true
  devtools:
    restart:
      enabled: true
      poll-interval: 1s
      quiet-period: 400ms
      additional-paths: src/main/java
      # 改 covers / avatar 等静态资源不需要重启 Spring 上下文
      exclude: static/**,public/**,META-INF/resources/**,META-INF/maven/**
    livereload:
      enabled: false
  datasource:
    url: jdbc:mysql://127.0.0.1/grecord?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
    username: root
    password: 123456
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 200MB
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password:
      timeout: 10s
      lettuce:
        pool:
          min-idle: 0
          max-idle: 8
          max-active: 8
          max-wait: -1ms

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

token:
  header: Authorization
  secret: abcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyzabcdefghijklmnopqrstuvwxyz123dsfjsaoi3121298312
  expireTime: 20160

avatar:
  upload.path: D:/GRecord/backend/target/classes/static/avatar
  access.path: /avatar
